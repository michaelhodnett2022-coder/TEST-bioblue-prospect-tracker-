* { box-sizing:border-box;margin:0;padding:0; }
body {

const GDRIVE_FOLDER_NAME = 'BioBlue Audits - TESTING';

const STATUS_ORDER  = ['New Lead','Contacted','Engaged','Quoted','Negotiating','Won','Lost'];
const STATUS_COLORS = {

function showToast(msg) {
  const t = document.getElementById('toast');

function todayStr() { return new Date().toISOString().slice(0,10); }
function addDays(dateStr, n) {
  const d = new Date(dateStr + 'T00:00:00');
  d.setDate(d.getDate() + n);
  return d.toISOString().slice(0,10);
}
function fmtDate(dateStr) {
  if (!dateStr) return '';
  const d = new Date(dateStr + 'T00:00:00');
  return d.toLocaleDateString('en-AU', { day:'numeric', month:'short' });
}
function uid() { return 'PT-' + Date.now() + '-' + Math.random().toString(36).slice(2,7); }

// =====================================================================
// AUTH + LOAD
// =====================================================================
function setAuthStatus(msg) { document.getElementById('authStatus').textContent = msg; }

async function ensureToken() {
  if (gdriveToken) return;
  await new Promise((resolve, reject) => {
    const client = google.accounts.oauth2.initTokenClient({
      client_id: GDRIVE_CLIENT_ID,
      scope: 'https://www.googleapis.com/auth/drive.file',
      callback: r => {
        if (r.access_token) { gdriveToken = r.access_token; resolve(); }
        else reject(new Error(r.error || 'Sign-in failed'));
      },
      error_callback: e => reject(new Error(e.message || 'Sign-in failed'))
    });
    client.requestAccessToken({ prompt: '' });
  });
}

// Same in-flight-promise-caching pattern used across every other Field
// Tools form's getOrCreateClientFolder, to avoid the duplicate-folder race
// condition already fixed elsewhere in the suite.
const _folderCache = {};
async function getOrCreateFolder(parentId, name) {
  const key = parentId + '::' + name;
  if (_folderCache[key]) return _folderCache[key];
  _folderCache[key] = (async () => {
    const sr = await fetch(
      `https://www.googleapis.com/drive/v3/files?q=${encodeURIComponent(`name='${name.replace(/'/g,"\\'")}' and '${parentId}' in parents and mimeType='application/vnd.google-apps.folder' and trashed=false`)}&fields=files(id)`,
      { headers: { Authorization: `Bearer ${gdriveToken}` } }
    );
    if (!sr.ok) throw new Error(`Folder search failed (${sr.status})`);
    const sd = await sr.json();
    if (sd.files && sd.files.length) return sd.files[0].id;
    const cr = await fetch('https://www.googleapis.com/drive/v3/files', {
      method: 'POST',
      headers: { Authorization: `Bearer ${gdriveToken}`, 'Content-Type': 'application/json' },
      body: JSON.stringify({ name, mimeType: 'application/vnd.google-apps.folder', parents: [parentId] })
    });
    if (!cr.ok) throw new Error(`Folder creation failed (${cr.status})`);
    const created = await cr.json();
    if (!created.id) throw new Error('Folder creation returned no ID');
    return created.id;
  })();
  try { return await _folderCache[key]; }
  catch (e) { delete _folderCache[key]; throw e; }
}

// =====================================================================
// CLIENT RECORDS — read/write the shared spreadsheet, and mint a new
// Client ID the first time a Tracker lead needs a quote. Mirrors the
// exact header list, ID format (BB-XXXX sequential), and 'Prospect ✓'
// value ('✓') used by the Prospect/Client form, so a row created here
// is indistinguishable from one that form would have created — Quote
// Builder and the Prospect/Client form need zero changes to read it.
// =====================================================================
const CLIENT_RECORDS_HEADERS = [
  'Client ID','Billing Entity','Site Name','Site Location Name','Descriptor','Trackpod Name',
  'Street Address','Suburb','State','Postcode',
  'Business Contact Name','Business Contact Role','Business Contact Email','Business Contact Phone',
  'KDM Name','KDM Role','KDM Email','KDM Phone',
  'Logistics Name','Logistics Role','Logistics Email','Logistics Phone',
  'Admin Contact Name','Admin Contact Role','Admin Contact Email','Admin Contact Phone',
  'Other Contact Label','Other Contact Name','Other Contact Role','Other Contact Email','Other Contact Phone',
  'POD Email','POD Email 2','POD Email 3',
  'Contact Name','Contact Title','Contact Mobile','Contact Email',
  'Product Interest','Current Supplier','Estimated Volume','Estimated Current Price','Active Products',
  'Is Distributor / Reseller','Additional Invoicing Emails','PO Required','PO Delivery Email',
  'BDM Email','Max Vehicle Size','Latest Note',
  'Prospect \u2713','Quote Sent \u2713','Site Admin \u2713','Site Audit \u2713','Pkg Assessment \u2713','Customer \u2713',
  'Prospect Doc #','Admin Doc #','Audit Doc #','Packaged Doc #','Quote Doc #','Record Status',
  'Drive Folder ID','Created Date','Created By','Cloned From Client ID','Notes Log'
];

let _adminSheetIdCache = null;
async function getOrCreateAdminSheetId(rootFolderId) {
  if (_adminSheetIdCache) return _adminSheetIdCache;
  const adminFolderId = await getOrCreateFolder(rootFolderId, 'ADMIN DATA - DO NOT REMOVE');
  const sr = await fetch(
    `https://www.googleapis.com/drive/v3/files?q=name='${CLIENT_RECORDS_NAME}' and '${adminFolderId}' in parents and trashed=false&fields=files(id)`,
    { headers: { Authorization: `Bearer ${gdriveToken}` } }
  );
  const sd = await sr.json();
  if (sd.files && sd.files.length) { _adminSheetIdCache = sd.files[0].id; return _adminSheetIdCache; }

  // Not found — create a fresh workbook with the correct columns, same
  // structure the Prospect/Client form creates if it gets there first.
  const wb = XLSX.utils.book_new();
  const ws = XLSX.utils.aoa_to_sheet([CLIENT_RECORDS_HEADERS]);
  XLSX.utils.book_append_sheet(wb, ws, 'Client Records');
  const nws = XLSX.utils.aoa_to_sheet([['Client ID','Billing Entity','Site Name','Timestamp','Form','BDM','Notes']]);
  XLSX.utils.book_append_sheet(wb, nws, 'Notes Log');
  const out = XLSX.write(wb, { bookType: 'xlsx', type: 'array' });
  const blob = new Blob([out], { type: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' });
  const form = new FormData();
  form.append('metadata', new Blob([JSON.stringify({ name: CLIENT_RECORDS_NAME, parents: [adminFolderId] })], { type: 'application/json' }));
  form.append('file', blob);
  const cr = await fetch('https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart&fields=id', {
    method: 'POST', headers: { Authorization: `Bearer ${gdriveToken}` }, body: form
  });
  _adminSheetIdCache = (await cr.json()).id;
  return _adminSheetIdCache;
}

async function getDriveRootId() {
  const rf = await fetch(
    `https://www.googleapis.com/drive/v3/files?q=name='${GDRIVE_FOLDER_NAME}' and mimeType='application/vnd.google-apps.folder' and trashed=false&fields=files(id)`,
    { headers: { Authorization: `Bearer ${gdriveToken}` } }
  );
  const rd = await rf.json();
  if (rd.files && rd.files.length) return rd.files[0].id;
  const cr = await fetch('https://www.googleapis.com/drive/v3/files', {
    method: 'POST', headers: { Authorization: `Bearer ${gdriveToken}`, 'Content-Type': 'application/json' },
    body: JSON.stringify({ name: GDRIVE_FOLDER_NAME, mimeType: 'application/vnd.google-apps.folder' })
  });
  return (await cr.json()).id;
}

// Mints a Client ID + Drive folder (inside Prospects/) the first time a
// quote is needed for this lead, and writes a Client Records row with
// 'Prospect ✓' already set — so Quote Builder's existing gate passes
// with zero changes to that file. Returns the new Client ID.
async function mintClientId(p) {
  const rootId = await getDriveRootId();
  const prospectsId = await getOrCreateFolder(rootId, PROSPECTS_FOLDER);
  const folderName = (p.company || 'Unnamed').slice(0, 50);
  const clientFolderId = await getOrCreateFolder(prospectsId, folderName);

  const sheetId = await getOrCreateAdminSheetId(rootId);
  const dl = await fetch(`https://www.googleapis.com/drive/v3/files/${sheetId}?alt=media`, { headers: { Authorization: `Bearer ${gdriveToken}` } });
  const ab = await dl.arrayBuffer();
  const wb = XLSX.read(new Uint8Array(ab), { type: 'array' });
  const ws = wb.Sheets['Client Records'];
  const rows = XLSX.utils.sheet_to_json(ws, { header: 1 });
  const headers = rows[0] || CLIENT_RECORDS_HEADERS;

  const idCol = headers.indexOf('Client ID');
  const existingIds = rows.slice(1).map(r => r[idCol]).filter(Boolean);
  const maxId = existingIds.reduce((m, id) => { const n = parseInt((id + '').replace('BB-', '')); return isNaN(n) ? m : (n > m ? n : m); }, 0);
  const newId = `BB-${String(maxId + 1).padStart(4, '0')}`;

  const targetRow = new Array(headers.length).fill('');
  const set = (col, val) => { const i = headers.indexOf(col); if (i > -1) targetRow[i] = val; };
  set('Client ID', newId);
  set('Billing Entity', p.company || '');
  set('Descriptor', p.descriptor || '');
  set('Street Address', p.streetAddress || '');
  set('Suburb', p.suburb || '');
  set('State', p.state || '');
  set('Postcode', p.postcode || '');
  set('Product Interest', p.productInterest || '');
  set('Current Supplier', p.currentSupplier || '');
  set('Estimated Volume', p.estimatedVolume || '');
  set('Business Contact Name', p.contactName || '');
  set('Business Contact Role', p.contactRole || '');
  set('Business Contact Email', p.contactEmail || '');
  set('Business Contact Phone', p.contactPhone || '');
  set('KDM Name', p.contact2Name || '');
  set('KDM Role', p.contact2Role || '');
  set('KDM Email', p.contact2Email || '');
  set('KDM Phone', p.contact2Phone || '');
  set('Other Contact Label', p.contact3Label || '');
  set('Other Contact Name', p.contact3Name || '');
  set('Other Contact Email', p.contact3Email || '');
  set('Other Contact Phone', p.contact3Phone || '');
  set('BDM Email', 'michael.hodnett@bioblue.com.au');
  set('Prospect \u2713', '\u2713');
  set('Record Status', 'Prospect');
  set('Drive Folder ID', clientFolderId);
  set('Created Date', todayStr());
  set('Created By', 'Prospect Tracker');

  rows.push(targetRow);
  const newWs = XLSX.utils.aoa_to_sheet(rows);
  const newWb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(newWb, newWs, 'Client Records');
  if (wb.Sheets['Notes Log']) XLSX.utils.book_append_sheet(newWb, wb.Sheets['Notes Log'], 'Notes Log');
  const out = XLSX.write(newWb, { bookType: 'xlsx', type: 'array' });
  const blob = new Blob([out], { type: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' });
  await fetch(`https://www.googleapis.com/upload/drive/v3/files/${sheetId}?uploadType=media`, {
    method: 'PATCH', headers: { Authorization: `Bearer ${gdriveToken}`, 'Content-Type': 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' }, body: blob
  });

  return newId;
}

// Drive keeps a folder's ID stable across a parent change — this is a
// genuine move, not a delete-and-recreate, so the Drive Folder ID already
// stored in Client Records, and any direct link to it, keeps working.
async function moveFolderToClients(folderId) {
  const rootId = await getDriveRootId();
  const clientsId = await getOrCreateFolder(rootId, CLIENTS_FOLDER);
  const meta = await fetch(`https://www.googleapis.com/drive/v3/files/${folderId}?fields=parents`, { headers: { Authorization: `Bearer ${gdriveToken}` } });
  const metaData = await meta.json();
  const currentParents = (metaData.parents || []).join(',');
  await fetch(`https://www.googleapis.com/drive/v3/files/${folderId}?addParents=${clientsId}&removeParents=${currentParents}`, {
    method: 'PATCH', headers: { Authorization: `Bearer ${gdriveToken}` }
  });
}

// Primary forward action from the tracker. If this lead already has a
// Client ID (a quote was generated before), just opens Quote Builder
// against it. Otherwise mints one first — the only Drive-folder-creating
// action in the whole tracker, deliberately deferred until a quote is
// actually needed so leads that go nowhere never create Drive clutter.
async function generateQuote(id) {
  const p = findProspect(id);
  if (!p) return;
  try {
    if (!p.clientId) {
      await ensureToken();
      showToast('Setting up client record...');
      p.clientId = await mintClientId(p);
      if (p.status === 'New Lead' || p.status === 'Contacted') p.status = 'Engaged';
      saveTracker();
    }
    window.location.href = `${QUOTE_BUILDER_URL}/?client=${encodeURIComponent(p.clientId)}&name=${encodeURIComponent(p.company)}`;
  } catch (e) {
    showToast('\u26A0\uFE0F Could not set up client record — ' + e.message);
  }
}

async function getTrackerFileId() {
  if (trackerFileId) return trackerFileId;
  const rf = await fetch(
    `https://www.googleapis.com/drive/v3/files?q=name='${GDRIVE_FOLDER_NAME}' and mimeType='application/vnd.google-apps.folder' and trashed=false&fields=files(id)`,
    { headers: { Authorization: `Bearer ${gdriveToken}` } }
  );
  const rd = await rf.json();
  if (!rd.files || !rd.files.length) throw new Error('BioBlue Audits folder not found');
  const rootId = rd.files[0].id;

  const adminId   = await getOrCreateFolder(rootId, 'ADMIN DATA - DO NOT REMOVE');
  const trackerId = await getOrCreateFolder(adminId, TRACKER_SUBFOLDER);

  const fr = await fetch(
    `https://www.googleapis.com/drive/v3/files?q=name='${TRACKER_FILE_NAME}' and '${trackerId}' in parents and trashed=false&fields=files(id)`,
    { headers: { Authorization: `Bearer ${gdriveToken}` } }
  );
  const fd = await fr.json();
  if (fd.files && fd.files.length) { trackerFileId = fd.files[0].id; return trackerFileId; }

  // Not found — create fresh file, seeded with the six starter prospects
  // (see getSeedProspects above). This branch only ever runs once, the
  // moment the file doesn't exist yet in Drive.
  const form = new FormData();
  form.append('metadata', new Blob([JSON.stringify({ name: TRACKER_FILE_NAME, parents: [trackerId] })], { type: 'application/json' }));
  form.append('file', new Blob([JSON.stringify(getSeedProspects())], { type: 'application/json' }));
  const cr = await fetch('https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart&fields=id', {
    method: 'POST', headers: { Authorization: `Bearer ${gdriveToken}` }, body: form
  });
  const cd = await cr.json();
  trackerFileId = cd.id;
  return trackerFileId;
}

async function loadTracker() {
  setAuthStatus('\uD83D\uDD10 Connecting to Google...');
  try {
    await ensureToken();
    setAuthStatus('\uD83D\uDCC2 Fetching prospects...');
    const fileId = await getTrackerFileId();
    const dl = await fetch(`https://www.googleapis.com/drive/v3/files/${fileId}?alt=media`, { headers: { Authorization: `Bearer ${gdriveToken}` } });
    const text = await dl.text();
    prospects = text.trim() ? JSON.parse(text) : [];
    setAuthStatus(`\u2705 ${prospects.length} prospect${prospects.length!==1?'s':''} loaded`);
    render();
  } catch (e) {
    gdriveToken = null;
    setAuthStatus('\u274C ' + e.message);
  }
}

async function saveTracker() {
  if (!gdriveToken || !trackerFileId) { showToast('Tap Load first to connect'); return; }
  // Coalesce rapid successive saves (e.g. two quick taps) into one write —
  // last state always wins, matches the documented storage limitation.
  if (saveInFlight) { saveQueued = true; return; }
  saveInFlight = true;
  try {
    const res = await fetch(`https://www.googleapis.com/upload/drive/v3/files/${trackerFileId}?uploadType=media`, {
      method: 'PATCH',
      headers: { Authorization: `Bearer ${gdriveToken}`, 'Content-Type': 'application/json' },
      body: JSON.stringify(prospects)
    });
    if (!res.ok) throw new Error('Save failed (' + res.status + ')');
  } catch (e) {
    showToast('\u26A0\uFE0F Save failed — ' + e.message);
  } finally {
    saveInFlight = false;
    if (saveQueued) { saveQueued = false; saveTracker(); }
  }
}

// =====================================================================
// NOTES LOG SYNC — every call/email/note gets written to the same Notes
// Log sheet the Prospect/Client form already uses for client conversations,
// so prospect conversations are exportable the same way. Runs as a strict
// queue (not in parallel) so two rapid taps can't read-modify-write over
// each other and silently drop one entry. Before a Client ID exists, the
// Tracker's own id stands in for it in the Client ID column.
// =====================================================================
let _notesLogQueue = Promise.resolve();
function syncActivityToNotesLog(p, activityText) {
  _notesLogQueue = _notesLogQueue
    .then(() => doSyncActivityToNotesLog(p, activityText))
    .catch(() => showToast('\u26A0\uFE0F Could not sync to Notes Log \u2014 saved locally, will retry next action'));
  return _notesLogQueue;
}

async function doSyncActivityToNotesLog(p, activityText) {
  await ensureToken();
  const rootId = await getDriveRootId();
  const sheetId = await getOrCreateAdminSheetId(rootId);
  const dl = await fetch(`https://www.googleapis.com/drive/v3/files/${sheetId}?alt=media`, { headers: { Authorization: `Bearer ${gdriveToken}` } });
  if (!dl.ok) throw new Error('Notes Log download failed (' + dl.status + ')');
  const ab = await dl.arrayBuffer();
  const wb = XLSX.read(new Uint8Array(ab), { type: 'array' });

  const notesRows = wb.Sheets['Notes Log']
    ? XLSX.utils.sheet_to_json(wb.Sheets['Notes Log'], { header: 1 })
    : [['Client ID', 'Billing Entity', 'Site Name', 'Timestamp', 'Form', 'BDM', 'Notes']];
  notesRows.push([p.clientId || p.id, p.company, p.company, new Date().toISOString(), 'Prospect Tracker', 'Michael Hodnett', activityText]);
  const newNotesWs = XLSX.utils.aoa_to_sheet(notesRows);

  const newWb = XLSX.utils.book_new();
  if (wb.Sheets['Client Records']) XLSX.utils.book_append_sheet(newWb, wb.Sheets['Client Records'], 'Client Records');
  XLSX.utils.book_append_sheet(newWb, newNotesWs, 'Notes Log');
  const out = XLSX.write(newWb, { bookType: 'xlsx', type: 'array' });
  const blob = new Blob([out], { type: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' });
  const up = await fetch(`https://www.googleapis.com/upload/drive/v3/files/${sheetId}?uploadType=media`, {
    method: 'PATCH', headers: { Authorization: `Bearer ${gdriveToken}`, 'Content-Type': 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' }, body: blob
  });
  if (!up.ok) throw new Error('Notes Log upload failed (' + up.status + ')');
}

function findProspect(id) { return prospects.find(p => p.id === id); }

function logActivity(id, type, text) {
  const p = findProspect(id);
  if (!p) return;
  p.activity.push({ date: todayStr(), type, text });
  // Bump New Lead -> Contacted automatically on first real activity.
  if (p.status === 'New Lead' && (type === 'email' || type === 'call')) p.status = 'Contacted';
  // Suggest next follow-up 7 days out unless one is already set in the future.
  const suggested = addDays(todayStr(), 7);
  if (!p.nextFollowUp || p.nextFollowUp < todayStr()) p.nextFollowUp = suggested;
  saveTracker();
  render();
  // Logged locally above (never lost even if this fails) — now sync to the
  // shared spreadsheet in the background so it's exportable.
  syncActivityToNotesLog(p, text);
}

// A native prompt() is deliberate here — it adds zero permanent UI (nothing
// sits on the card taking up space), only appearing at the exact moment
// you tap Call made / Email sent. Leaving it blank (or cancelling) still
// logs the tap itself, just with the old generic text, so the fast one-tap
// workflow is unchanged when there's genuinely nothing more to note.
function quickLogCall(id) {
  const notes = prompt('What was discussed? (optional — leave blank to just log the call)');
  const text = (notes && notes.trim()) ? `Call made \u2014 ${notes.trim()}` : 'Follow-up call made';
  logActivity(id, 'call', text);
}
function quickLogEmail(id) {
  const notes = prompt('Any notes on this email? (optional — leave blank to just log it)');
  const text = (notes && notes.trim()) ? `Email sent \u2014 ${notes.trim()}` : 'Cold-call email sent';
  logActivity(id, 'email', text);
}

function addNote(id, inputEl) {
  const text = inputEl.value.trim();
  if (!text) return;
  logActivity(id, 'note', text);
  inputEl.value = '';
}

function changeStatus(id, newStatus) {
  const p = findProspect(id);
  if (!p) return;
  if (newStatus === 'Lost') { openLostModal(id); return; }
  const wasWon = p.status === 'Won';
  p.status = newStatus;
  saveTracker();
  render();
  // Won is the trigger to move the Drive folder out of Prospects/ into
  // Clients/ — only fires once, and only if a folder actually exists yet
  // (a lead could reach Won without ever generating a quote, e.g. if
  // Michael onboards them directly via Complete Client Details instead).
  if (newStatus === 'Won' && !wasWon && p.clientId) {
    ensureToken().then(() => moveClientFolderOnWon(p)).catch(() => {
      showToast('\u26A0\uFE0F Could not move folder to Clients — tap Won again to retry');
    });
  }
}

async function moveClientFolderOnWon(p) {
  try {
    const rootId = await getDriveRootId();
    const sheetId = await getOrCreateAdminSheetId(rootId);
    const dl = await fetch(`https://www.googleapis.com/drive/v3/files/${sheetId}?alt=media`, { headers: { Authorization: `Bearer ${gdriveToken}` } });
    const ab = await dl.arrayBuffer();
    const wb = XLSX.read(new Uint8Array(ab), { type: 'array' });
    const ws = wb.Sheets['Client Records'];
    const rows = XLSX.utils.sheet_to_json(ws, { header: 1 });
    const headers = rows[0] || [];
    const idCol = headers.indexOf('Client ID');
    const folderCol = headers.indexOf('Drive Folder ID');
    const custCol = headers.indexOf('Customer \u2713');
    const rowIdx = rows.findIndex((r, i) => i > 0 && (r[idCol] || '') === p.clientId);
    if (rowIdx === -1) return;
    const folderId = rows[rowIdx][folderCol];
    if (folderId) await moveFolderToClients(folderId);
    if (custCol > -1) rows[rowIdx][custCol] = '\u2713';
    const newWs = XLSX.utils.aoa_to_sheet(rows);
    const newWb = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(newWb, newWs, 'Client Records');
    if (wb.Sheets['Notes Log']) XLSX.utils.book_append_sheet(newWb, wb.Sheets['Notes Log'], 'Notes Log');
    const out = XLSX.write(newWb, { bookType: 'xlsx', type: 'array' });
    const blob = new Blob([out], { type: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' });
    await fetch(`https://www.googleapis.com/upload/drive/v3/files/${sheetId}?uploadType=media`, {
      method: 'PATCH', headers: { Authorization: `Bearer ${gdriveToken}`, 'Content-Type': 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' }, body: blob
    });
    showToast('Moved to Clients folder');
  } catch (e) {
    showToast('\u26A0\uFE0F Folder move failed — ' + e.message);
  }
}

function updateFollowUp(id, dateVal) {
  const p = findProspect(id);
  if (!p) return;
  p.nextFollowUp = dateVal || null;

// Deliberately avoids a full render() — that would rebuild every card from
// scratch and collapse whichever detail panel is currently open. Patches
// only the visible header text that could have changed instead.
function updateField(id, field, value) {
  const p = findProspect(id);
  if (!p) return;
  p[field] = (value || '').trim();
  saveTracker();
  const detail = document.getElementById('detail-' + id);
  const card = detail ? detail.closest('.p-card') : null;
  if (card) {
    const nameEl = card.querySelector('.p-company');
    const metaEl = card.querySelector('.p-meta');
    if (nameEl) nameEl.textContent = p.company;
    if (metaEl) metaEl.textContent = `${p.state}${p.contactName ? ' · ' + p.contactName : ''}`;
  }
}

function promoteToClient(id) {
  const p = findProspect(id);
  if (!p) return;
  // Once a Client ID exists (minted via Generate Quote), this is now a
  // real client record — open it in normal edit mode so nothing gets
  // duplicated. Only use the prefill-only path for a lead that's never
  // had a quote generated and has no Client ID yet.
  if (p.clientId) {
    window.location.href = `${PROSPECT_FORM_URL}/?client=${encodeURIComponent(p.clientId)}`;
    return;
  }
  const params = new URLSearchParams({
    promote: '1',
    company: p.company || '',
    contactName: p.contactName || '',
    contactPhone: p.contactPhone || '',
    contactEmail: p.contactEmail || '',
    state: p.state || '',
    trackerId: p.id
  });
  window.location.href = `${PROSPECT_FORM_URL}/?${params.toString()}`;
}

        </div>
        <div></div>
      </div>
      <div style="margin:12px 0 6px;font-size:10px;font-weight:700;letter-spacing:0.6px;text-transform:uppercase;color:rgba(255,255,255,0.35);">Sales info</div>
      <div class="p-field-row">
        <div>
          <label>Product interest</label>
          <input type="text" value="${escapeHtml(p.productInterest||'')}" onchange="updateField('${p.id}','productInterest',this.value)">
        </div>
        <div>
          <label>Current supplier</label>
          <input type="text" value="${escapeHtml(p.currentSupplier||'')}" onchange="updateField('${p.id}','currentSupplier',this.value)">
        </div>
      </div>
      <div class="p-field-row">
        <div>
          <label>Estimated volume</label>
          <input type="text" value="${escapeHtml(p.estimatedVolume||'')}" placeholder="e.g. 5,000L/month" onchange="updateField('${p.id}','estimatedVolume',this.value)">
        </div>
        <div></div>
      </div>
      <div style="margin:12px 0 6px;font-size:10px;font-weight:700;letter-spacing:0.6px;text-transform:uppercase;color:rgba(255,255,255,0.35);">Site contact</div>
      <div class="p-field-row">
        <div>
          <label>Name</label>
          <input type="text" value="${escapeHtml(p.contactName||'')}" onchange="updateField('${p.id}','contactName',this.value)">
        </div>
        <div>
          <label>Role</label>
          <input type="text" value="${escapeHtml(p.contactRole||'')}" placeholder="e.g. Fleet Manager" onchange="updateField('${p.id}','contactRole',this.value)">
        </div>
      </div>
      <div class="p-field-row">
        <div>
          <label>Phone</label>
          <input type="text" value="${escapeHtml(p.contactPhone||'')}" onchange="updateField('${p.id}','contactPhone',this.value)">
        </div>
        <div>
          <label>Email</label>
          <input type="text" value="${escapeHtml(p.contactEmail||'')}" onchange="updateField('${p.id}','contactEmail',this.value)">
        </div>
      </div>
      <div style="margin:12px 0 6px;font-size:10px;font-weight:700;letter-spacing:0.6px;text-transform:uppercase;color:rgba(255,255,255,0.35);">Key decision maker (optional)</div>
      <div class="p-field-row">
        <div>
          <label>Name</label>
          <input type="text" value="${escapeHtml(p.contact2Name||'')}" onchange="updateField('${p.id}','contact2Name',this.value)">
        </div>
        <div>
          <label>Role</label>
          <input type="text" value="${escapeHtml(p.contact2Role||'')}" placeholder="e.g. Site Manager" onchange="updateField('${p.id}','contact2Role',this.value)">
        </div>
      </div>
      <div class="p-field-row">
        <div>
          <label>Phone</label>
          <input type="text" value="${escapeHtml(p.contact2Phone||'')}" onchange="updateField('${p.id}','contact2Phone',this.value)">
        </div>
        <div>
          <label>Email</label>
          <input type="text" value="${escapeHtml(p.contact2Email||'')}" onchange="updateField('${p.id}','contact2Email',this.value)">
        </div>
      </div>
      <div style="margin:12px 0 6px;font-size:10px;font-weight:700;letter-spacing:0.6px;text-transform:uppercase;color:rgba(255,255,255,0.35);">Other (optional)</div>
      <div class="p-field-row">
        <div>
          <label>Label</label>
          <input type="text" value="${escapeHtml(p.contact3Label||'')}" placeholder="e.g. Accounts, Broker" onchange="updateField('${p.id}','contact3Label',this.value)">
        </div>
        <div>
          <label>Name</label>
          <input type="text" value="${escapeHtml(p.contact3Name||'')}" onchange="updateField('${p.id}','contact3Name',this.value)">
        </div>
      </div>
      <div class="p-field-row">
        <div>
          <label>Phone</label>
          <input type="text" value="${escapeHtml(p.contact3Phone||'')}" onchange="updateField('${p.id}','contact3Phone',this.value)">
        </div>
        <div>
          <label>Email</label>
          <input type="text" value="${escapeHtml(p.contact3Email||'')}" onchange="updateField('${p.id}','contact3Email',this.value)">
        </div>
      </div>
      <div class="p-field-row">
        <div>
          <label>Status</label>
          <select onchange="changeStatus('${p.id}', this.value)">${statusOptionsHtml(p.status)}</select>
        </div>
        <div>
          <label>Next follow-up</label>
          <input type="date" value="${p.nextFollowUp || ''}" onchange="updateFollowUp('${p.id}', this.value)">
        </div>
      </div>
      <div class="quick-actions">
        <button class="qa-btn" onclick="quickLogCall('${p.id}')">\u260E\uFE0F Call made</button>
        <button class="qa-btn" onclick="quickLogEmail('${p.id}')">\u2709\uFE0F Email sent</button>
        <button class="qa-btn promote" onclick="generateQuote('${p.id}')">${p.clientId ? '\u2192 Open quote builder' : '\u2192 Generate quote'}</button>
        <button class="qa-btn" onclick="promoteToClient('${p.id}')">Complete client details</button>
        <button class="qa-btn lost" onclick="openLostModal('${p.id}')">Mark lost</button>
      </div>
      <div class="activity-log">${activityHtml}</div>
      <div class="add-note-row">
        <input type="text" placeholder="Add a note..." onkeydown="if(event.key==='Enter'){addNote('${p.id}', this);}">
        <button class="btn btn-ghost" onclick="addNote('${p.id}', this.previousElementSibling)">Add</button>
      </div>
      ${p.lostReason ? `<div class="lost-reason-tag">Lost — ${escapeHtml(p.lostReason)}</div>` : ''}
    </div>
  </div>`;
}

function escapeHtml(s) {
  return (s || '').toString().replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

function render() {
  const visible = prospects.filter(p => {
    if (stateFilter !== 'ALL' && p.state !== stateFilter) return false;
    if (searchFilter) {
      const haystack = (p.company + ' ' + (p.contactName || '')).toLowerCase();
      if (!haystack.includes(searchFilter)) return false;
    }
    return true;
  });
  const active = visible.filter(p => p.status !== 'Lost');
  const lost   = visible.filter(p => p.status === 'Lost');

  const overdue  = active.filter(p => bucketFor(p) === 'overdue');
  const today    = active.filter(p => bucketFor(p) === 'today');
  const upcoming = active.filter(p => bucketFor(p) === 'upcoming').sort((a,b) => a.nextFollowUp.localeCompare(b.nextFollowUp));
  const nodate   = active.filter(p => bucketFor(p) === 'nodate');

  const section = (label, cls, list) => {
    if (!list.length) return '';
    return `<div class="section-label ${cls}">${label} <span class="section-count">${list.length}</span></div>` +
           list.map(cardHtml).join('');
  };

  const dash = document.getElementById('dashboard');
  const html = section('Overdue','overdue',overdue) + section('Due today','today',today) +
               section('Upcoming','upcoming',upcoming) + section('No follow-up set','nodate',nodate);
  const filterActive = stateFilter !== 'ALL' || !!searchFilter;
  const emptyMsg = filterActive
    ? `No prospects match ${searchFilter ? `"${searchFilter}"` : 'that filter'} — try clearing the search or switching state.`
    : 'No active prospects yet — add one above, or tap Load if you already have some in Drive.';
  dash.innerHTML = html || `<div class="empty-note">${emptyMsg}</div>`;

  document.getElementById('lostCount').textContent = lost.length;
  document.getElementById('lostWrap').innerHTML = lost.length
    ? lost.map(cardHtml).join('')
    : '<div class="empty-note">Nothing marked lost yet</div>';
}

render();
</script>
</body>
</html>
